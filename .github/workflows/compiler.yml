name: compiler

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Error-code registry
        run: node scripts/errors.mjs --check

      - name: Font lock present and consistent
        run: node -e "const fs=require('fs');const l=JSON.parse(fs.readFileSync('shared/fonts.lock.json','utf8'));if(!l.count||!l.setSha256)process.exit(1);console.log('fonts:',l.count,'set',l.setSha256.slice(0,12))"

      - name: Pure-Node test suites (machine-readable)
        run: |
          mkdir -p out
          node scripts/test-all.mjs --json | tee out/test-all.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-all-report
          path: out/test-all.json
          if-no-files-found: ignore

      - name: Spec gates (pages / theme / APCA)
        run: node scripts/spec-lint.mjs --spec fixtures/mini-41s/spec.json --root .

      - name: Plan compiler
        run: node templates/plan.mjs --spec fixtures/mini-41s/spec.json --root . --check

      - name: CLI smoke
        run: |
          node bin/cvs.mjs new "赛博像素的宣传片，30秒竖屏" --out out/ci.spec.json
          node bin/cvs.mjs lint out/ci.spec.json --root .
          node bin/cvs.mjs plan out/ci.spec.json --root . --check

      - name: Motion profile smoke
        run: |
          node bin/cvs.mjs motion list
          node bin/cvs.mjs motion derive --kind promo --style cyber-pixel
          node bin/cvs.mjs motion matrix

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build local fonts
        run: node scripts/build-fonts.mjs

      # Same machine, two passes: proves frames are reproducible here.
      # Cross-machine hashes in fixtures/golden/manifest.json are font/Chrome
      # dependent, so CI checks self-consistency instead of the committed hashes.
      - name: Golden self-check
        env:
          CHROME_EXE: google-chrome
        run: node scripts/golden.mjs --selfcheck

  windows-static:
    # 跨平台契约：Windows 路径 / CRLF / 反斜杠不能只在作者机器上成立。
    # 不渲染，只跑纯模块与 spec 闸门。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pure-Node tests
        run: node scripts/test-core.mjs

      - name: Compiler contract
        run: node scripts/test-compiler-contract.mjs

      - name: Versioning contract
        run: node scripts/test-versioning.mjs

      - name: Type tokens (static half)
        run: node scripts/test-type-tokens.mjs

      - name: Spec gates
        run: node scripts/spec-lint.mjs --spec fixtures/mini-41s/spec.json --root .

      - name: Plan gates
        run: node bin/cvs.mjs plan fixtures/mini-41s/spec.json --root . --check

