<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 建议在项目里放一份本地字体 CSS（含 @font-face），路径按项目结构调整 -->
<link rel="stylesheet" href="/shared/fonts.css">
<title>segment</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  /* 如需叠加 DOM/KaTeX，可在这里放绝对定位层；但不要用 CSS transition/animation */
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import {
  createSegment, applyImpact2D, drawFlash, drawCapsuleLabel, drawCountdown, drawStamp,
  loadFonts, rng, TAU,
} from './common.js';
import { themeFromURL, chrome, drawThemeBackground, drawGlassPanel, hexToRgba } from './themes.js';
import { createEditBridge, mergePatches } from './edit-bridge.mjs';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---------- segment config ----------
// 正常预览:  http://127.0.0.1:4600/segments/01.html
// 片段模式:  ?seg=1&t0=0.35&speed=1.4&dur=3   (渲染器自动加)
// 主题:      ?theme=aqua-morandi / claude / 珊瑚 …（不传 = 旧版默认画面）
const seg = createSegment({ duration: 3.0 });
window.DURATION = seg.duration;

// 所有随机都必须来自固定种子；同一 t 永远同一画面
const rnd = rng(20251023);
const STARS = Array.from({ length: 140 }, () => ({
  x: rnd.range(0, W), y: rnd.range(0, H),
  r: rnd.range(0.4, 2.0), a: rnd.range(0.15, 0.85), ph: rnd.range(0, TAU),
}));

const BRAND = '{{BRAND}}';

// ---------- theme ----------
// 不传 ?theme= → 走旧版画面（与改动前逐像素一致）；传了就由 themes.js 驱动背景/HUD/内容配色。
const p = new URLSearchParams(location.search);
const HAS_THEME = p.has('theme');
const THEME = themeFromURL(location.search);
const HUD = HAS_THEME ? chrome(THEME) : null;

const PLACEHOLDER_TITLE = '风格段标题';
const PLACEHOLDER_SUB = '替换 drawScene() 开始做真正的画面';
const IS_GLASS = HAS_THEME && !!(THEME.material && THEME.material.glass);
const TC = HAS_THEME ? THEME.colors : null;

// ---------- spec（D3 编辑契约的唯一真相） ----------
// patches 为空 → 所有字段回退到本页默认值，渲染结果与改动前一致。
const SPEC = {
  specVersion: 1,
  kind: 'segment',
  meta: { name: 'segment', brand: BRAND },
  params: {
    hud: { capsule: '示例风格', category: '分类', countdown: null, stamp: BRAND },
    title: { text: PLACEHOLDER_TITLE, sub: PLACEHOLDER_SUB },
  },
  patches: [],
};

// 本页默认值（主题/旧版各自一套），__inspect 的 props 报的是实际生效值。
const DEF = {
  capsuleColor: HAS_THEME ? HUD.capsule.numberColor : '#d97757',
  countdownColor: HAS_THEME ? HUD.countdown.color : 'rgba(245,240,232,0.72)',
  countdownSize: 34,
  stampColor: HAS_THEME ? HUD.stamp.color : 'rgba(245,240,232,0.42)',
  stampSize: 22,
  titleColor: HAS_THEME ? TC.ink : '#f5f0e8',
  titleSize: IS_GLASS ? 116 : 160,
  subColor: HAS_THEME ? TC.accent : '#d97757',
  subSize: IS_GLASS ? 32 : 40,
  subText: IS_GLASS ? '半透明白 · 1px 高光边 · 淡绿/淡粉柔光只从玻璃里透出来' : PLACEHOLDER_SUB,
};

const SCHEMA = {
  capsule: {
    text: { type: 'text', label: '标签', maxLength: 12 },
    category: { type: 'text', label: '分类', maxLength: 8 },
    color: { type: 'color', label: '编号颜色' },
  },
  countdown: {
    text: { type: 'text', label: '倒计时文案', maxLength: 8 },
    color: { type: 'color', label: '颜色' },
    size: { type: 'size', label: '字号', min: 16, max: 80, step: 1 },
  },
  stamp: {
    text: { type: 'text', label: '水印', maxLength: 24 },
    color: { type: 'color', label: '颜色' },
    size: { type: 'size', label: '字号', min: 10, max: 48, step: 1 },
  },
  title: {
    text: { type: 'text', label: '主标题', maxLength: 24 },
    color: { type: 'color', label: '标题颜色' },
    size: { type: 'size', label: '字号', min: 40, max: 240, step: 2 },
  },
  sub: {
    text: { type: 'text', label: '副标题', maxLength: 60 },
    color: { type: 'color', label: '副标题颜色' },
    size: { type: 'size', label: '字号', min: 16, max: 96, step: 1 },
  },
};

function numberOr(v, lo, hi, d) {
  const n = Number(v);
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d;
}
function textOr(v, d, max) {
  return v == null ? d : String(v).slice(0, max);
}
function colorOr(v, d) {
  return typeof v === 'string' && v ? v : d;
}

/** SPEC + patches → 本帧实际生效的参数。 */
function eff() {
  const P = SPEC.patches;
  const hud = mergePatches(P, 'hud', null, {});
  const cap = mergePatches(P, 'hud', 'hud.capsule', {});
  const cd = mergePatches(P, 'hud', 'hud.countdown', {});
  const st = mergePatches(P, 'hud', 'hud.stamp', {});
  const ti = mergePatches(P, 'title', 'title.main', {});
  const su = mergePatches(P, 'title', 'title.sub', {});
  return {
    capsule: {
      text: textOr(cap.text ?? hud.capsule, '示例风格', 12),
      category: textOr(cap.category ?? hud.category, '分类', 8),
      color: colorOr(cap.color ?? hud.capsuleColor, DEF.capsuleColor),
    },
    countdown: {
      text: cd.text ?? hud.countdown ?? null,          // null = 按 u 自动计算
      color: colorOr(cd.color ?? hud.countdownColor, DEF.countdownColor),
      size: numberOr(cd.size ?? hud.countdownSize, 16, 80, DEF.countdownSize),
    },
    stamp: {
      text: textOr(st.text ?? hud.stamp, BRAND, 24),
      color: colorOr(st.color ?? hud.stampColor, DEF.stampColor),
      size: numberOr(st.size ?? hud.stampSize, 10, 48, DEF.stampSize),
    },
    title: {
      text: textOr(ti.text ?? hud.title, PLACEHOLDER_TITLE, 24),
      color: colorOr(ti.color ?? hud.titleColor, DEF.titleColor),
      size: numberOr(ti.size ?? hud.titleSize, 40, 240, DEF.titleSize),
    },
    sub: {
      text: textOr(su.text ?? hud.sub, DEF.subText, 60),
      color: colorOr(su.color ?? hud.subColor, DEF.subColor),
      size: numberOr(su.size ?? hud.subSize, 16, 96, DEF.subSize),
    },
  };
}

// ---------- hit map helpers（D3：只登记矩形，不额外绘制像素） ----------
function fontSizeOf(font) {
  const m = String(font).match(/(\d+(?:\.\d+)?)px/);
  return m ? parseFloat(m[1]) : 40;
}

/** 当前 ctx 变换下的设计坐标矩形（已包含 applyImpact2D 的缩放/抖动）。 */
function rectFromCtx(x, y, w, h) {
  const t = (typeof ctx.getTransform === 'function') ? ctx.getTransform() : null;
  if (!t) return [x, y, w, h];
  const p1 = t.transformPoint(new DOMPoint(x, y));
  const p2 = t.transformPoint(new DOMPoint(x + w, y + h));
  return [Math.min(p1.x, p2.x), Math.min(p1.y, p2.y), Math.abs(p2.x - p1.x), Math.abs(p2.y - p1.y)];
}

/** fillText 之后调用：用同一 font/transform 量出文本矩形并登记。 */
function addTextHit(id, role, text, x, y, opt) {
  const size = opt.size || fontSizeOf(ctx.font);
  const w = ctx.measureText(text).width;
  let x0 = x;
  const align = opt.align || 'center';
  if (align === 'right' || align === 'end') x0 = x - w;
  else if (align === 'center') x0 = x - w / 2;
  const y0 = y - size * (opt.baseline === 'alphabetic' ? 0.82 : 0.5);
  bridge.add({
    id, role,
    rect: rectFromCtx(x0, y0, w, size),
    props: { text, color: opt.color, size },
    schema: opt.schema,
  });
}

function addCapsuleHit(E, opts) {
  const { x = 96, y = 72, h = 58, padX = 26, font = '600 26px "Noto Sans SC", sans-serif' } = opts;
  const num = '01';
  const label = E.category ? `${E.text} · ${E.category}` : E.text;
  ctx.save();
  ctx.font = font;
  const w = padX * 2 + ctx.measureText(num).width + 14 + ctx.measureText(label).width;
  ctx.restore();
  bridge.add({
    id: 'hud.capsule', role: 'hud',
    rect: rectFromCtx(x, y, w, h),
    props: { text: E.text, category: E.category, color: opts.numberColor ?? DEF.capsuleColor },
    schema: SCHEMA.capsule,
  });
}

function addCountdownHit(text, opts) {
  const { x = 1824, y = 1016, size = DEF.countdownSize, font = 'JetBrains Mono, monospace' } = opts;
  ctx.save();
  ctx.font = `${size}px ${font}`;
  const w = ctx.measureText(text).width;
  ctx.restore();
  bridge.add({
    id: 'hud.countdown', role: 'hud',
    rect: rectFromCtx(x - w, y - size * 0.82, w, size),
    props: { text, color: opts.color ?? DEF.countdownColor, size },
    schema: SCHEMA.countdown,
  });
}

function addStampHit(text, opts) {
  const { x = 1824, y = 72, size = DEF.stampSize, align = 'right', font = 'JetBrains Mono, monospace' } = opts;
  ctx.save();
  ctx.font = `${size}px ${font}`;
  const w = ctx.measureText(text).width;
  ctx.restore();
  const x0 = align === 'right' ? x - w : (align === 'center' ? x - w / 2 : x);
  bridge.add({
    id: 'hud.stamp', role: 'hud',
    rect: rectFromCtx(x0, y - size / 2, w, size),
    props: { text, color: opts.color ?? DEF.stampColor, size },
    schema: SCHEMA.stamp,
  });
}

/** 倒计时文本（与 common.js drawCountdown 完全一致）。 */
function countdownText(u) {
  const remain = Math.max(0, Math.ceil(seg.duration - u - 0.001));
  return `00:0${Math.min(9, remain)}`;
}

/** 有 patch 覆盖 text 时按同一套参数自绘，否则走 common.js 原函数（保证默认路径逐像素不变）。 */
function drawCountdownMaybe(u, E, opts) {
  if (E.text == null) {
    drawCountdown(ctx, u, seg.duration, opts);
    return countdownText(u);
  }
  const { x = 1824, y = 1016, size = DEF.countdownSize, color = DEF.countdownColor, font = 'JetBrains Mono, monospace' } = opts;
  const text = String(E.text).slice(0, 8);
  ctx.save();
  ctx.font = `${size}px ${font}`;
  ctx.fillStyle = color;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y);
  ctx.restore();
  return text;
}

/** 标准 chrome：胶囊 / 倒计时 / 水印。默认参数与 common.js 缺省值逐值一致。 */
function drawChrome(u, E) {
  const capBase = HAS_THEME ? { ...HUD.capsule } : {};
  const capOpts = E.capsule.color ? { ...capBase, numberColor: E.capsule.color } : capBase;
  drawCapsuleLabel(ctx, 1, E.capsule.text, E.capsule.category, capOpts);
  addCapsuleHit(E.capsule, capOpts);

  const cdBase = HAS_THEME ? { ...HUD.countdown } : {};
  const cdOpts = {
    ...cdBase,
    ...(E.countdown.color ? { color: E.countdown.color } : {}),
    ...(E.countdown.size != null ? { size: E.countdown.size } : {}),
  };
  const cdText = drawCountdownMaybe(u, E.countdown, cdOpts);
  addCountdownHit(cdText, cdOpts);

  const stBase = HAS_THEME ? { y: 72, size: 22, ...HUD.stamp } : { y: 72, size: 22 };
  const stOpts = {
    ...stBase,
    ...(E.stamp.color ? { color: E.stamp.color } : {}),
    ...(E.stamp.size != null ? { size: E.stamp.size } : {}),
  };
  drawStamp(ctx, E.stamp.text, stOpts);
  addStampHit(E.stamp.text, stOpts);
}

// ---------- themed helpers ----------
function radialGlow(cx, cy, radius, color, alpha) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
  g.addColorStop(0, hexToRgba(color, alpha));
  g.addColorStop(0.6, hexToRgba(color, alpha * 0.4));
  g.addColorStop(1, hexToRgba(color, 0));
  ctx.fillStyle = g;
  ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

// 主题演示内容：背景 = drawThemeBackground；玻璃主题画一块液态玻璃信息卡（淡绿/淡粉柔光可见）。
function drawThemedScene(t, u) {
  const E = eff();
  const c = THEME.colors;
  const m = THEME.material || {};
  const isGlass = !!m.glass;
  const accent = c.accent;
  const tintA = (m.tints && m.tints[0]) || c.accentSoft;
  const tintB = (m.tints && m.tints[1]) || c.accentSoft;
  const cx = W / 2, cy = H * 0.52;

  drawThemeBackground(ctx, THEME, W, H, t);

  if (isGlass) {
    // 信息卡：1 块液态玻璃 + 卡后淡绿/淡粉柔光
    const pw = 1060, ph = 470, px = (W - pw) / 2, py = H * 0.5 - ph / 2 - 8;
    radialGlow(px + 90, py - 40, 430, tintA, 0.5);
    radialGlow(px + pw - 130, py + ph + 20, 460, tintB, 0.46);
    radialGlow(cx, cy, 720, accent, 0.18);
    drawGlassPanel(ctx, THEME, { x: px, y: py, w: pw, h: ph, r: 42 });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = hexToRgba(c.ink, 0.5);
    ctx.font = '500 22px "JetBrains Mono", monospace';
    ctx.fillText(`LIQUID GLASS · ${String(THEME.nameEn || THEME.id).toUpperCase()}`, cx, py + 74);

    ctx.fillStyle = E.title.color;
    ctx.font = `900 ${E.title.size}px "Noto Sans SC", sans-serif`;
    const titleY = py + ph * 0.42;
    ctx.fillText(E.title.text, cx, titleY);
    addTextHit('title.main', 'title', E.title.text, cx, titleY, { color: E.title.color, size: E.title.size, schema: SCHEMA.title });

    ctx.fillStyle = E.sub.color;
    ctx.font = `500 ${E.sub.size}px "Noto Sans SC", sans-serif`;
    const subY = py + ph * 0.655;
    ctx.fillText(E.sub.text, cx, subY);
    addTextHit('title.sub', 'title', E.sub.text, cx, subY, { color: E.sub.color, size: E.sub.size, schema: SCHEMA.sub });

    // 两块主题色片：证明淡绿 / 淡粉确实来自主题数据
    const pillW = 168, pillH = 54, gap = 24;
    const x0 = cx - pillW - gap / 2;
    const y0 = py + ph - 100;
    for (const [x, fill, label] of [[x0, tintA, '淡绿'], [x0 + pillW + gap, tintB, '淡粉']]) {
      roundRect(x, y0, pillW, pillH, pillH / 2);
      ctx.fillStyle = hexToRgba(fill, 0.78);
      ctx.fill();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.stroke();
      ctx.fillStyle = c.ink;
      ctx.font = '600 24px "Noto Sans SC", sans-serif';
      ctx.fillText(label, x + pillW / 2, y0 + pillH / 2 + 1);
    }
  } else {
    // 其他主题：材质背景 + 主题强调色圆环/柔光 + 主题色文字，不塞玻璃。
    const glowColor = THEME.mode === 'dark' ? accent : (c.accentSoft || accent);
    radialGlow(cx, cy, 640, glowColor, THEME.mode === 'dark' ? 0.34 : 0.4);

    const r = 230 + 14 * Math.sin(t * 2.1);
    ctx.strokeStyle = hexToRgba(accent, 0.9);
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, r, t * 0.9, t * 0.9 + Math.PI * 1.5);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = E.title.color;
    ctx.font = `900 ${E.title.size}px "Noto Sans SC", sans-serif`;
    const titleY = cy - 20;
    ctx.fillText(E.title.text, cx, titleY);
    addTextHit('title.main', 'title', E.title.text, cx, titleY, { color: E.title.color, size: E.title.size, schema: SCHEMA.title });

    ctx.fillStyle = E.sub.color;
    ctx.font = `500 ${E.sub.size}px "Noto Sans SC", sans-serif`;
    const subY = cy + 150;
    ctx.fillText(E.sub.text, cx, subY);
    addTextHit('title.sub', 'title', E.sub.text, cx, subY, { color: E.sub.color, size: E.sub.size, schema: SCHEMA.sub });
  }

  // standard chrome（胶囊 / 倒计时 / 水印）
  drawChrome(u, E);
}

// ---------- scene (legacy default, ?theme= 未传时与旧版逐像素一致) ----------
// 替换成你的风格场景。t = 场景时间（秒，已按 t0/speed 映射），u = 片段本地时间
function drawLegacyScene(t, u) {
  const E = eff();
  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#071026');
  bg.addColorStop(1, '#0e0e0d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // starfield (deterministic twinkle)
  for (const s of STARS) {
    const a = s.a * (0.72 + 0.28 * Math.sin(t * 1.6 + s.ph));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // === demo content: replace this block with the real style ===
  const cx = W / 2, cy = H * 0.52;
  const glow = ctx.createRadialGradient(cx, cy, 20, cx, cy, 560);
  glow.addColorStop(0, 'rgba(217,119,87,0.33)');
  glow.addColorStop(1, 'rgba(217,119,87,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  const r = 230 + 14 * Math.sin(t * 2.1);
  ctx.strokeStyle = 'rgba(217,119,87,0.9)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx, cy, r, t * 0.9, t * 0.9 + Math.PI * 1.5); ctx.stroke();

  ctx.fillStyle = E.title.color;
  ctx.font = `900 ${E.title.size}px "Noto Sans SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const titleY = cy - 20;
  ctx.fillText(E.title.text, cx, titleY);
  addTextHit('title.main', 'title', E.title.text, cx, titleY, { color: E.title.color, size: E.title.size, schema: SCHEMA.title });

  ctx.fillStyle = E.sub.color;
  ctx.font = `500 ${E.sub.size}px "Noto Sans SC", sans-serif`;
  const subY = cy + 150;
  ctx.fillText(E.sub.text, cx, subY);
  addTextHit('title.sub', 'title', E.sub.text, cx, subY, { color: E.sub.color, size: E.sub.size, schema: SCHEMA.sub });
  // === end demo content ===

  // standard chrome
  drawChrome(u, E);
}

function drawScene(t, u) {
  if (HAS_THEME) drawThemedScene(t, u);
  else drawLegacyScene(t, u);
}

// ---------- render frame ----------
window.renderFrame = (u) => {
  const sample = seg.sample(u);
  const { t, fx } = sample;
  bridge.setTime(sample.u);
  bridge.begin();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  applyImpact2D(ctx, fx, W, H);
  drawScene(t, u);
  ctx.restore();
  drawFlash(ctx, fx.flash, W, H);
};

// ---------- edit contract（D3） ----------
const bridge = createEditBridge({
  getSpec: () => SPEC,
  setPatch: (patches) => { SPEC.patches = patches; },
  renderAt: (t) => window.renderFrame(t),
  canvas,
});
bridge.install();

// ---------- readiness ----------
window.__ready = false;
(async () => {
  await loadFonts(['Noto Sans SC', 'Inter', 'JetBrains Mono', 'ZCOOL KuaiLe']);
  window.renderFrame(0);
  window.__ready = true;
})().catch((err) => { window.__bootError = String(err && err.stack || err); });

// 调试：控制台里可用 window.__seg.sample(1.0)
window.__seg = seg;
</script>
</body>
</html>
