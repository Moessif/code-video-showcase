<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>recipe 27 · vaporwave</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a0b2e; }
  #c { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script type="module">
// recipe-vaporwave.html — 风格段 27「蒸汽波 / 渐变天空 / 透视网格 / 扫描线太阳 / 镀铬字」。
//
// 渲染契约：window.DURATION / window.renderFrame(t)（纯函数）/ __ready / __bootError。
// 画幅（D7）：setupStage() 取视口；竖屏太阳上移、网格地平线抬高、标题居中。
//
// 视觉：深紫→品红渐变天空、地平线透视网格（向灭点收敛）、带扫描线缺口的
// 落日、镀铬渐变标题、青/品红霓虹。后期叠扫描线 + 色散。
// 入场：天空淡入，太阳升起，网格向远方推进（t 驱动），标题色散揭示。
// 确定性：全部 t 的纯函数；扫描线/色散用 effects.mjs。
import { createSegment, applyImpact2D, drawFlash, loadFonts, vars } from './common.js';
import { themeFromURL, getTheme, loadFontsFor, hexToRgba } from './themes.js';
import { TAU, clamp, ease, setupStage, safePad, fitTextSize, drawTracked, drawHud, drawTopMeta } from './recipes/util.js';
import { typeSize, safe, probe } from './tokens.mjs';
import { drawScanlines } from './effects.mjs';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const { W, H, portrait } = setupStage(canvas);
const pad = safePad(W, H);

const params = new URLSearchParams(location.search);
const seg = createSegment({ duration: 3.0 });
window.DURATION = seg.duration;
const THEME = getTheme(themeFromURL(location.search));
const V = vars();
const BRAND = String(V.brand || 'CVS').slice(0, 24);
const TITLE = String(params.get('title') || V.title || '永恒黄昏').slice(0, 12);
const SUB = String(V.subtitle || 'A E S T H E T I C · 1 9 8 6').slice(0, 40);

const SKY_TOP = '#1a0b2e';
const SKY_BOT = '#5e1a6e';
const MAGENTA = '#ff2bd6';
const CYAN = '#2affff';
const SUN_TOP = '#ffd319';
const SUN_BOT = '#ff2975';

const SANS = '"Noto Sans SC", sans-serif';
const SERIF = '"Noto Serif SC", Georgia, serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';
const FAMILIES = Array.from(new Set([...(loadFontsFor(THEME) || []), 'Noto Sans SC', 'Noto Serif SC', 'JetBrains Mono']));

let L = null;
function buildLayout() {
  const horizon = Math.round(H * (portrait ? 0.62 : 0.66));
  const sunR = Math.round(Math.min(W, H) * (portrait ? 0.20 : 0.22));
  const sunCx = Math.round(W * 0.5);
  const sunCy = horizon - Math.round(sunR * 0.35);
  const titleSize = fitTextSize(ctx, TITLE, { maxWidth: W - pad * 2, family: SERIF, weight: 900, maxSize: typeSize('title', W, H), minSize: 44, spacing: 0.06 });
  probe('title', titleSize, safe(W, H));
  return {
    horizon, sunR, sunCx, sunCy, titleSize,
    titleY: Math.round(H * (portrait ? 0.30 : 0.30)),
    subSize: Math.max(13, Math.round(titleSize * 0.2)),
    vpX: W * 0.5,
  };
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, L.horizon);
  g.addColorStop(0, SKY_TOP);
  g.addColorStop(1, SKY_BOT);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, L.horizon);
  ctx.fillStyle = '#0d0620';
  ctx.fillRect(0, L.horizon, W, H - L.horizon);
}

function drawSun(t) {
  const rise = ease.outCubic(clamp(t / 0.8));
  const cy = L.sunCy + (1 - rise) * L.sunR * 0.8;
  ctx.save();
  ctx.beginPath();
  ctx.arc(L.sunCx, cy, L.sunR, 0, TAU);
  ctx.clip();
  const g = ctx.createLinearGradient(0, cy - L.sunR, 0, cy + L.sunR);
  g.addColorStop(0, SUN_TOP);
  g.addColorStop(1, SUN_BOT);
  ctx.fillStyle = g;
  ctx.fillRect(L.sunCx - L.sunR, cy - L.sunR, L.sunR * 2, L.sunR * 2);
  // 扫描线缺口（下半部，越往下越宽）
  ctx.fillStyle = SKY_BOT;
  const gaps = 7;
  for (let i = 0; i < gaps; i++) {
    const fy = cy + (i / gaps) * L.sunR;
    const gh = Math.max(2, (i / gaps) * L.sunR * 0.16);
    ctx.fillRect(L.sunCx - L.sunR, fy, L.sunR * 2, gh);
  }
  ctx.restore();
  // 光晕
  ctx.save();
  ctx.globalAlpha = 0.25 * rise;
  const gl = ctx.createRadialGradient(L.sunCx, cy, L.sunR * 0.6, L.sunCx, cy, L.sunR * 1.8);
  gl.addColorStop(0, hexToRgba(MAGENTA, 0.5));
  gl.addColorStop(1, hexToRgba(MAGENTA, 0));
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, W, L.horizon);
  ctx.restore();
}

function drawGrid(t) {
  ctx.save();
  ctx.strokeStyle = hexToRgba(MAGENTA, 0.55);
  ctx.lineWidth = 1.5;
  const vpX = L.vpX, vpY = L.horizon;
  // 纵向收敛线
  const n = 16;
  for (let i = -n; i <= n; i++) {
    const x = vpX + (i / n) * W * 1.4;
    ctx.beginPath(); ctx.moveTo(vpX, vpY); ctx.lineTo(x, H); ctx.stroke();
  }
  // 横向推进线（t 驱动，向观察者移动）
  const rows = 12;
  const scroll = (t * 0.6) % 1;
  for (let i = 0; i < rows; i++) {
    const f = (i + scroll) / rows;
    const y = vpY + Math.pow(f, 2.2) * (H - vpY);
    ctx.globalAlpha = 0.25 + 0.5 * f;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  // 地平线霓虹
  ctx.save();
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2;
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(0, vpY + 0.5); ctx.lineTo(W, vpY + 0.5); ctx.stroke();
  ctx.restore();
}

function drawTitle(t) {
  const tk = ease.outCubic(clamp((t - 0.4) / 0.7));
  if (tk <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = tk;
  ctx.font = `900 ${L.titleSize}px ${SERIF}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const g = ctx.createLinearGradient(0, L.titleY - L.titleSize / 2, 0, L.titleY + L.titleSize / 2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.5, CYAN);
  g.addColorStop(1, MAGENTA);
  // 色散：先画偏移的青/品红残影，再画主字
  const split = (1 - tk) * 10 + 2;
  ctx.fillStyle = hexToRgba(CYAN, 0.5);
  ctx.fillText(TITLE, W / 2 - split, L.titleY);
  ctx.fillStyle = hexToRgba(MAGENTA, 0.5);
  ctx.fillText(TITLE, W / 2 + split, L.titleY);
  ctx.fillStyle = g;
  ctx.fillText(TITLE, W / 2, L.titleY);
  ctx.restore();
  const sk = ease.outCubic(clamp((t - 0.8) / 0.5));
  if (sk > 0.001) {
    ctx.save();
    ctx.globalAlpha = sk;
    drawTracked(ctx, SUB, W / 2, L.titleY + L.titleSize * 0.9, { size: L.subSize, family: MONO, weight: 500, color: hexToRgba(CYAN, 0.8), tracking: L.subSize * 0.4, align: 'center', baseline: 'middle' });
    ctx.restore();
  }
}

window.renderFrame = (u) => {
  const { t, fx } = seg.sample(u);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  applyImpact2D(ctx, fx, W, H);
  drawSky();
  drawSun(t);
  drawGrid(t);
  drawTitle(t);
  drawScanlines(ctx, { W, H, step: 4, alpha: 0.08 });
  drawTopMeta(ctx, { W, H, pad, text: `${BRAND} · VAPORWAVE`, sub: 'RECIPE 27 · RETRO', color: hexToRgba(CYAN, 0.6), accent: MAGENTA });
  drawHud(ctx, { W, H, u, duration: seg.duration, theme: THEME, label: 'STYLE 27', name: 'VAPORWAVE', brand: BRAND, pad, accent: MAGENTA, ink: hexToRgba(CYAN, 0.5), frameColor: CYAN });
  ctx.restore();
  drawFlash(ctx, fx.flash, W, H, '#ffffff');
};

window.__ready = false;
window.__bootError = null;
(async () => {
  await loadFonts(FAMILIES);
  L = buildLayout();
  window.renderFrame(0);
  window.__ready = true;
})().catch((err) => { window.__bootError = String((err && err.stack) || err); });
window.__seg = seg;
</script>
</body>
</html>
