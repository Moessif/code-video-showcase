<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/shared/fonts.css">
<title>big card</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0e0d; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<script type="module">
import { loadFonts, clamp, ease, rng, mulberry32 } from './common.js';
import { themeFromURL, cardColors, mix } from './themes.js';
import { createEditBridge, mergePatches } from './edit-bridge.mjs';

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
window.DURATION = 1.0;

// ---------- per-card config (pass via the --page URL, e.g. --page "/big-card.html?layout=1&index=2") ----------
const p = new URLSearchParams(location.search);
const CARD = {
  layout: parseInt(p.get('layout') ?? '0', 10) % 4,   // 0 accent bg / 1 paper / 2 dark centered / 3 dark left
  index: parseInt(p.get('index') ?? '1', 10),
  total: parseInt(p.get('total') ?? '11', 10),
  color: p.get('color') ?? '#ffcf5c',
  first: p.get('first') ?? '想做',
  keyword: p.get('keyword') ?? '科普视频？',
  brand: p.get('brand') ?? '{{BRAND}}',
};

const FONT = '"Noto Sans SC", "Inter", sans-serif';
let rnd = rng(1200 + CARD.index * 37);

// ---------- theme ----------
// 不传 ?theme= 时保留旧模板的默认路径（旧硬编码配色 + ?color= 强调色），保证逐像素不变。
// 传 ?theme= 时颜色全部由 themes.js 的 cardColors(theme, layout) 驱动；角落 HUD 用卡片 ink 派生。
const HAS_THEME = p.has('theme');
const HAS_COLOR_PARAM = p.has('color');
const THEME = themeFromURL(location.search);

// ---------- spec（D3 编辑契约的唯一真相） ----------
// 默认渲染不读 patches（空数组 → 全部回退到 URL 参数），所以补丁机制不改变现有画面。
const SPEC = {
  specVersion: 1,
  kind: 'big-card',
  meta: { name: 'big-card', brand: CARD.brand },
  params: {
    card: {
      layout: CARD.layout,
      index: CARD.index,
      total: CARD.total,
      color: CARD.color,
      first: CARD.first,
      keyword: CARD.keyword,
      brand: CARD.brand,
    },
  },
  patches: [],
};

// ---------- color helpers ----------
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const v = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
}

// 任意 CSS 颜色（#hex / rgb() / rgba()）→ [r,g,b,a]
function parseColor(color) {
  const s = String(color).trim();
  if (s[0] === '#') {
    const h = s.slice(1);
    const f = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    return [parseInt(f.slice(0, 2), 16), parseInt(f.slice(2, 4), 16), parseInt(f.slice(4, 6), 16), 1];
  }
  const m = s.match(/^rgba?\(([^)]+)\)$/i);
  if (m) {
    const parts = m[1].split(',').map((x) => parseFloat(x));
    return [parts[0] | 0, parts[1] | 0, parts[2] | 0, parts.length > 3 ? parts[3] : 1];
  }
  return [0, 0, 0, 1];
}
// 颜色 → 指定透明度
function withAlpha(color, alpha) {
  const [r, g, b] = parseColor(color);
  return `rgba(${r},${g},${b},${alpha})`;
}
// 主题色混合（themes.js 的 mix 失败时回退 a）
function mixHex(a, b, k) {
  try { return mix(a, b, k); } catch { return a; }
}
function contrast(a, b) {
  const lum = (c) => {
    const [r, g, bl] = parseColor(c);
    const lin = (v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(bl);
  };
  const l1 = lum(a), l2 = lum(b);
  const [hi, lo] = l1 >= l2 ? [l1, l2] : [l2, l1];
  return (hi + 0.05) / (lo + 0.05);
}

// ---------- palette: legacy path = 旧模板的逐值常量；theme path = cardColors 派生 ----------
// 由 (layout, 强调色) 参数化：默认传 CARD.layout / CARD.color，结果与改动前逐值一致；
// 编辑契约改颜色/版式时按新参数重算，重绘即可复现。
function computePal(layout, colorHex, explicitColor = false) {
  const [AC_R, AC_G, AC_B] = hexToRgb(colorHex);
  const AC = (a = 1) => `rgba(${AC_R},${AC_G},${AC_B},${a})`;
  const legacy = (extra) => Object.assign({
    bgTop: '#0e0e0d', bgBottom: null, grid: null,
    streakRgb: [AC_R, AC_G, AC_B], speedLine: AC(0.55), glowRgb: [AC_R, AC_G, AC_B],
    footerStyle: 'rgba(245,240,232,0.5)', footerBrand: 'rgba(245,240,232,0.35)', flash: '#fff',
  }, extra);

  if (!HAS_THEME) {
    if (layout === 0) {
      return legacy({
        bgTop: colorHex,
        bgBottom: `rgba(${AC_R * 0.82 | 0},${AC_G * 0.82 | 0},${AC_B * 0.82 | 0},1)`,
        grid: 'rgba(0,0,0,0.06)',
        firstColor: '#0e0e0d',
        keyColor: '#0e0e0d',
        echo: 'rgba(255,255,255,0.07)',
        underline: 'rgba(14,14,13,0.9)',
      });
    }
    if (layout === 1) {
      return legacy({
        bgTop: '#f4efe6',
        grid: 'rgba(20,20,20,0.045)',
        firstColor: '#0e0e0d',
        keyColor: '#0e0e0d',
        echo: 'rgba(20,20,20,0.07)',
        underline: AC(1),
        footerStyle: 'rgba(20,20,20,0.5)',
        footerBrand: 'rgba(20,20,20,0.35)',
      });
    }
    return legacy({
      firstColor: 'rgba(245,240,232,0.92)',
      keyColor: CARD.color,
      echo: 'rgba(255,255,255,0.07)',
    });
  }

  // theme path
  const CC = cardColors(THEME, layout);
  // ?color= 或编辑契约的 card.color patch 都可作为强调色覆盖（保持旧模板「逐卡换色」的用法），
  // 其余一律取自主题。
  const accent = (HAS_COLOR_PARAM || explicitColor)
    ? colorHex
    : (CC.field === 'accent' ? CC.bg : CC.keyword);
  const accentRgb = parseColor(accent).slice(0, 3);
  // 角落 HUD 跟着卡片 ink 走（对比度兜底），不套主题的亮/暗 HUD 规格：
  // layout0 强调底 / layout1 纸底 / layout2,3 暗卡都能保证可读。
  const footerFor = (bg) => {
    const base = contrast(CC.ink, bg) >= 2.5 ? CC.ink : (THEME.colors.cardDarkInk || '#f5f0e8');
    return { footerStyle: withAlpha(base, 0.5), footerBrand: withAlpha(base, 0.35) };
  };
  const flash = THEME.colors.flash;

  if (layout === 0) {
    return {
      bgTop: accent,
      bgBottom: mixHex(accent, '#000000', 0.18),
      grid: CC.grid,
      firstColor: CC.ink,
      keyColor: CC.ink,
      echo: CC.echo,
      underline: withAlpha(CC.ink, 0.9),
      streakRgb: accentRgb,
      speedLine: withAlpha(CC.ink, 0.35),
      glowRgb: parseColor(mixHex(accent, '#ffffff', 0.45)).slice(0, 3),
      ...footerFor(accent), flash,
    };
  }
  if (layout === 1) {
    // 纸底上强调色对比不足时（例如沿用旧 ?color= 的金色）退到 ink，保证大字可读。
    const paperKey = contrast(accent, CC.bg) >= 2.2 ? accent : CC.ink;
    return {
      bgTop: CC.bg,
      grid: CC.grid,
      firstColor: CC.ink,
      keyColor: paperKey,
      echo: CC.echo,
      underline: withAlpha(accent, 1),
      streakRgb: accentRgb,
      speedLine: withAlpha(accent, 0.55),
      glowRgb: accentRgb,
      ...footerFor(CC.bg), flash,
    };
  }
  // 暗卡：主题可能给出与 cardDark 同色的 accent（如 celadon-paper），保证关键词可读。
  let keyColor = accent;
  if (contrast(accent, CC.bg) < 2.0) {
    const soft = CC.ink; // cardDarkInk：同主题里的最高对比色
    keyColor = contrast(THEME.colors.accentSoft, CC.bg) >= 2 ? THEME.colors.accentSoft : soft;
  }
  return {
    bgTop: CC.bg,
    firstColor: withAlpha(CC.ink, 0.92),
    keyColor,
    echo: CC.echo,
    underline: null,
    streakRgb: accentRgb,
    speedLine: withAlpha(keyColor, 0.55),
    glowRgb: parseColor(keyColor).slice(0, 3),
    ...footerFor(CC.bg), flash,
  };
}

// ---------- pre-rendered text layers (blur 16px once, never per frame) ----------
function textLayer(text, { size, weight, color, blur = 0, y = H / 2, align = 'center', x = W / 2, maxW = W - 2 * 96 }) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.font = `${weight} ${size}px ${FONT}`;
  // auto fit
  let s = size;
  while (g.measureText(text).width > maxW && s > 40) {
    s -= 4; g.font = `${weight} ${s}px ${FONT}`;
  }
  if (blur > 0) g.filter = `blur(${blur}px)`;
  g.fillStyle = color;
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(text, x, y);
  c.__fontSize = s;                  // 实际字号（auto fit 后）
  c.__textW = g.measureText(text).width;
  c.__text = text;
  c.__color = color;
  return c;
}

function makeLayers(S) {
  const firstColor = S.first.color || PAL.firstColor;
  const keyColor = S.keyword.color || PAL.keyColor;
  const firstY = H / 2 - 116;
  const keyY = H / 2 + 60;
  const layers = [];
  for (const [text, size, weight, color, y, align] of [
    [S.first.text, S.first.size, 700, firstColor, firstY, 'center'],
    [S.keyword.text, S.keyword.size, 900, keyColor, keyY, 'center'],
  ]) {
    const sharp = textLayer(text, { size, weight, color, y, align });
    layers.push({
      sharp,
      blur: textLayer(text, { size, weight, color, blur: 16, y, align }),
      align,
      y,
      size: sharp.__fontSize,
      text,
      color,
    });
  }
  return { layers, firstColor, keyColor, keyY };
}
// ---------- effective params（SPEC + patches） ----------
// 默认 patches 为空 → 每个字段都回退到 CARD，与旧模板完全相同。
function effectiveState() {
  const P = SPEC.patches;
  const scope = mergePatches(P, 'card', null, {});
  const fp = mergePatches(P, 'card', 'card.first', {});
  const kp = mergePatches(P, 'card', 'card.keyword', {});
  const cp = mergePatches(P, 'card', 'card.color', {});
  const lp = mergePatches(P, 'card', 'card.layout', {});
  const ip = mergePatches(P, 'card', 'card.index', {});
  const bp = mergePatches(P, 'card', 'card.brand', {});

  const num = (v, lo, hi, d) => {
    const n = Number(v);
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d;
  };
  const int = (v, lo, hi, d) => Math.round(num(v, lo, hi, d));
  const str = (v, d, max) => (v == null ? d : String(v).slice(0, max));
  const pick = (v, d) => (typeof v === 'string' && v ? v : d);
  const patchedColor = cp.color ?? scope.color;

  return {
    layout: int(lp.layout ?? scope.layout, 0, 3, CARD.layout),
    index: int(ip.index ?? scope.index, 1, 99, CARD.index),
    total: int(scope.total, 1, 99, CARD.total),
    brand: str(bp.text ?? scope.brand, CARD.brand, 24),
    color: pick(patchedColor, CARD.color),
    // theme 路径下只有「显式指定」的颜色才覆盖主题强调色（与 ?color= 同义）
    colorExplicit: typeof patchedColor === 'string' && patchedColor.length > 0,
    first: {
      text: str(fp.text ?? scope.first, CARD.first, 8),
      size: num(fp.size, 24, 160, 76),
      color: typeof fp.color === 'string' && fp.color ? fp.color : null,
    },
    keyword: {
      text: str(kp.text ?? scope.keyword, CARD.keyword, 12),
      size: num(kp.size, 40, 300, 190),
      color: typeof kp.color === 'string' && kp.color ? kp.color : null,
    },
  };
}

let STATE = effectiveState();
let STATE_KEY = JSON.stringify(STATE);
let PAL = computePal(STATE.layout, STATE.color, STATE.colorExplicit);
// 版式 2/3 的背景条纹用 rnd 的连续状态（旧模板行为）；只有 index 变了才重播种。
let RND_INDEX = STATE.index;

// Pre-rendered layers must be rebuilt AFTER fonts load, otherwise CJK canvas text
// is rasterized with a fallback font (or nothing) and stays blank forever.
let ASSETS = makeLayers(STATE);

function ensureState() {
  const s = effectiveState();
  const key = JSON.stringify(s);
  if (key === STATE_KEY) return STATE;
  STATE = s;
  STATE_KEY = key;
  if (s.index !== RND_INDEX) { rnd = rng(1200 + s.index * 37); RND_INDEX = s.index; }
  PAL = computePal(s.layout, s.color, s.colorExplicit);
  ASSETS = makeLayers(s);
  return STATE;
}

// ---------- backgrounds ----------
function drawBackground() {
  if (STATE.layout === 0) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, PAL.bgTop);
    g.addColorStop(1, PAL.bgBottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 纸纹/网格
    if (PAL.grid) {
      ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 72) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 72) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }
  } else if (STATE.layout === 1) {
    ctx.fillStyle = PAL.bgTop; ctx.fillRect(0, 0, W, H);
    // 细网格 + 纸纹
    if (PAL.grid) {
      ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }
  } else {
    ctx.fillStyle = PAL.bgTop; ctx.fillRect(0, 0, W, H);
    // streak lines
    const [sr, sg, sb] = PAL.streakRgb;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    for (let i = 0; i < 34; i++) {
      const a = (i / 34) * Math.PI * 2 + 0.3;
      const len = 460 + rnd.range(0, 520);
      ctx.strokeStyle = `rgba(${sr},${sg},${sb},${0.06 + rnd.next() * 0.10})`;
      ctx.lineWidth = rnd.range(1, 3);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 120, Math.sin(a) * 120);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ---------- echo outline text (600px, drifts horizontally) ----------
function drawEcho(t) {
  ctx.save();
  ctx.font = `900 600px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = PAL.echo;
  ctx.strokeText(STATE.keyword.text, W / 2 + Math.sin(t * 1.1) * 70, H / 2 + 40);
  ctx.restore();
}

// ---------- slam motion ----------
// returns {scale, blurT (0=blur 16, 1=sharp), alpha, dx, dy}
function slam(localT) {
  const d = 0.11;
  if (localT < 0) return { scale: 1.7, blurT: 0, alpha: 0, dx: 0, dy: 0 };
  const k = clamp(localT / d);
  const e = ease.outExpo(k);
  return {
    scale: 1.7 - 0.7 * e,
    blurT: e,
    alpha: clamp(localT / 0.06),
    dx: 0,
    dy: (1 - e) * -18,
  };
}

// ---------- speed lines burst ----------
function drawSpeedLines(progress, amount = 26, color = PAL.speedLine) {
  if (progress <= 0 || progress >= 1) return;
  const t = ease.outCubic(progress);
  ctx.save();
  ctx.translate(W / 2, H / 2 + 30);
  const n = amount;
  const rr = mulberry32(900 + STATE.index);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rr() * 0.12;
    const len = (120 + rr() * 480) * (0.4 + t * 1.6);
    ctx.strokeStyle = color;
    ctx.globalAlpha = (1 - t) * (0.25 + rr() * 0.55);
    ctx.lineWidth = 1 + rr() * 2.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 90, Math.sin(a) * 90);
    ctx.lineTo(Math.cos(a) * (90 + len), Math.sin(a) * (90 + len));
    ctx.stroke();
  }
  ctx.restore();
}

function drawGlow(alpha) {
  if (alpha <= 0.001) return;
  const [gr, gg, gb] = PAL.glowRgb;
  const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 900);
  g.addColorStop(0, `rgba(${gr},${gg},${gb},${0.26 * alpha})`);
  g.addColorStop(1, `rgba(${gr},${gg},${gb},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawUnderline(t) {
  if (!PAL.underline) return;
  ctx.fillStyle = PAL.underline;
  // keyword underline: width from 0 -> 72% of keyword width, starting at second beat
  const local = clamp((t - 0.5) / 0.22);
  if (local <= 0) return;
  const w = 900 * ease.outCubic(local);
  const y = H / 2 + 182;
  ctx.fillRect(W / 2 - w / 2, y, w, 14);
}

// ---------- frame ----------
function drawLayer(layer, slamInfo, dx = 0, dy = 0) {
  ctx.save();
  ctx.translate(W / 2 + slamInfo.dx + dx, H / 2 + slamInfo.dy + dy);
  ctx.scale(slamInfo.scale, slamInfo.scale);
  ctx.translate(-W / 2, -H / 2);
  ctx.globalAlpha = slamInfo.alpha;
  if (slamInfo.blurT < 1) {
    ctx.globalAlpha = slamInfo.alpha * (1 - slamInfo.blurT);
    ctx.drawImage(layer.blur, 0, 0);
  }
  ctx.globalAlpha = slamInfo.alpha * slamInfo.blurT;
  ctx.drawImage(layer.sharp, 0, 0);
  ctx.restore();
}

// ---------- hit map（D3 编辑契约：只登记矩形，不额外绘制像素） ----------
// rect 一律是画布位图坐标；slam 缩放/位移与全局 shake 都折算进去，和实际绘制位置一致。
const SCHEMA = {
  first: {
    text: { type: 'text', label: '首行文案', maxLength: 8 },
    size: { type: 'size', label: '字号', min: 24, max: 160, step: 2 },
    color: { type: 'color', label: '文字颜色' },
  },
  keyword: {
    text: { type: 'text', label: '关键词', maxLength: 12 },
    size: { type: 'size', label: '字号', min: 40, max: 300, step: 2 },
    color: { type: 'color', label: '关键词颜色' },
  },
  accent: { color: { type: 'color', label: '强调色' } },
  index: { index: { type: 'number', label: '编号', min: 1, max: 99, step: 1 } },
  brand: { text: { type: 'text', label: '品牌', maxLength: 24 } },
  layout: {
    layout: {
      type: 'enum', label: '版式',
      options: [
        { value: 0, label: '强调底' },
        { value: 1, label: '纸底' },
        { value: 2, label: '暗卡居中' },
        { value: 3, label: '暗卡左' },
      ],
    },
  },
};

function textWidth(text, font) {
  ctx.save();
  ctx.font = font;
  const w = ctx.measureText(text).width;
  ctx.restore();
  return w;
}

function layerRect(layer) {
  const w = layer.sharp.__textW || 0;
  const h = layer.sharp.__fontSize || layer.size || 0;
  return [W / 2 - w / 2, layer.y - h / 2, w, h];
}

// drawLayer 的变换：translate(W/2+dx, H/2+dy) · scale(s) · translate(-W/2,-H/2)
function slamRect(rect, info, sx, sy) {
  const s = info.scale;
  return [
    sx + W / 2 + info.dx + s * (rect[0] - W / 2),
    sy + H / 2 + info.dy + s * (rect[1] - H / 2),
    rect[2] * s,
    rect[3] * s,
  ];
}

function shiftRect(rect, sx, sy) {
  return [rect[0] + sx, rect[1] + sy, rect[2], rect[3]];
}

function registerHits(S, view) {
  const first = ASSETS.layers[0];
  const key = ASSETS.layers[1];

  // 强调色（关键词下划线带；暗卡没有下划线时仍是同一片可点区域）
  bridge.add({
    id: 'card.color', role: 'accent',
    rect: shiftRect([W / 2 - 450, H / 2 + 166, 900, 30], view.sx, view.sy),
    props: { color: S.color },
    schema: SCHEMA.accent,
  });

  bridge.add({
    id: 'card.first', role: 'headline',
    rect: slamRect(layerRect(first), view.s1, view.sx, view.sy),
    props: { text: S.first.text, size: first.size, color: first.color },
    schema: SCHEMA.first,
  });

  bridge.add({
    id: 'card.keyword', role: 'keyword',
    rect: slamRect(layerRect(key), view.s2, view.sx, view.sy),
    props: { text: S.keyword.text, size: key.size, color: key.color },
    schema: SCHEMA.keyword,
  });

  const idxW = textWidth(view.footIndex, '500 22px "JetBrains Mono", monospace');
  bridge.add({
    id: 'card.index', role: 'meta',
    rect: [1824 - idxW + view.sx, 1016 - 22 + view.sy, idxW, 22],
    props: { index: S.index },
    schema: SCHEMA.index,
  });

  const brandW = textWidth(S.brand, '500 20px "JetBrains Mono", monospace');
  bridge.add({
    id: 'card.brand', role: 'meta',
    rect: [96 + view.sx, 1016 - 20 + view.sy, brandW, 20],
    props: { text: S.brand },
    schema: SCHEMA.brand,
  });

  // 版式没有独立可见控件：登记在左上角空白区（顶层，方便点选）
  bridge.add({
    id: 'card.layout', role: 'layout',
    rect: [96 + view.sx, 56 + view.sy, 220, 48],
    props: { layout: S.layout },
    schema: SCHEMA.layout,
  });
}

window.renderFrame = (u) => {
  const t = clamp(u, 0, 1);
  bridge.setTime(t);
  bridge.begin();
  const S = ensureState();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // shake: slam 1 at t=0 (6px), slam 2 at t=0.5 (12px)
  let shake = 0;
  if (t < 0.16) shake = 6 * (1 - t / 0.16);
  if (t >= 0.5 && t < 0.66) shake = 12 * (1 - (t - 0.5) / 0.16);
  const sx = shake * Math.sin(t * 240 + 1.3);
  const sy = shake * Math.cos(t * 190 + 0.2);

  ctx.save();
  ctx.translate(sx, sy);
  drawBackground();
  drawEcho(t);
  drawGlow(t < 0.12 ? 1 - t / 0.12 : 0);

  const s1 = slam(t);
  drawLayer(ASSETS.layers[0], s1);
  drawSpeedLines(t < 0.14 ? t / 0.14 : 0, 22, PAL.speedLine);

  const s2 = slam(t - 0.5);
  drawLayer(ASSETS.layers[1], s2);
  drawSpeedLines(t >= 0.5 && t < 0.64 ? (t - 0.5) / 0.14 : 0, 30, PAL.speedLine);
  drawUnderline(t);

  // footer chrome
  const footIndex = `STYLE ${String(S.index).padStart(2, '0')} / ${S.total}`;
  ctx.fillStyle = PAL.footerStyle;
  ctx.font = '500 22px "JetBrains Mono", monospace';
  ctx.textAlign = 'right';
  ctx.fillText(footIndex, 1824, 1016);
  ctx.textAlign = 'left';
  ctx.fillStyle = PAL.footerBrand;
  ctx.font = '500 20px "JetBrains Mono", monospace';
  ctx.fillText(S.brand, 96, 1016);
  ctx.restore();

  // opening flash (card cut impact)
  if (t < 0.09) {
    ctx.save();
    ctx.globalAlpha = 0.85 * (1 - t / 0.09);
    ctx.fillStyle = PAL.flash; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  registerHits(S, { s1, s2, sx, sy, footIndex });
};

// ---------- edit contract（D3） ----------
const bridge = createEditBridge({
  getSpec: () => SPEC,
  setPatch: (patches) => { SPEC.patches = patches; },
  renderAt: (t) => window.renderFrame(t),
  canvas,
});
bridge.install();

window.__ready = false;
(async () => {
  await loadFonts(['Noto Sans SC', 'Inter', 'JetBrains Mono', 'Orbitron']);
  ASSETS = makeLayers(STATE);     // rebuild text canvases with the real fonts
  window.renderFrame(0);
  window.__ready = true;
})().catch((e) => { window.__bootError = String(e && e.stack || e); });
</script>
</body>
</html>
